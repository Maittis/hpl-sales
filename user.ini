upload_max_filesize=200M
post_max_size=210M
max_execution_time=600
max_file_uploads=5
memory_limit=256M

; Apache mod_deflate does not cover the PHP handler on every host, so the
; same compression is requested here as well. The homepage document is ~198KB
; uncompressed and roughly 20KB gzipped.
zlib.output_compression = On
zlib.output_compression_level = 6
zlib.output_handler = ob_gzhandler